name = "otomad-daw"
compatibility_date = "2026-03-07"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# `deploy:preview` passed `--env preview` with no matching section, so it
# failed on every invocation. Preview deploys target their own Worker so they
# cannot overwrite production.
[env.preview]
name = "otomad-daw-preview"

[env.preview.assets]
directory = "./dist"
not_found_handling = "single-page-application"
