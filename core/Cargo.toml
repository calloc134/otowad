[package]
name = "otomad-core"
version = "0.1.0"
edition = "2021"
# The shipped application links a GPL-2.0-or-later FFmpeg/WASM build, so the
# combined work is GPL. This crate follows the same terms; see /LICENSE.
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
loqa-voice-dsp = "0.5.0"

[dev-dependencies]
proptest = "1"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
